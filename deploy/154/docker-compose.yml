services:
  postgres:
    image: m.daocloud.io/docker.io/library/postgres:15
    container_name: zhihuiji154-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhihuiji}
      POSTGRES_USER: ${POSTGRES_USER:-zhihuiji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhihuiji}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhihuiji} -d ${POSTGRES_DB:-zhihuiji}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: m.daocloud.io/docker.io/library/redis:7
    container_name: zhihuiji154-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: zhihuiji154-backend:latest
    container_name: zhihuiji154-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 18080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-zhihuiji}
      DB_USER: ${POSTGRES_USER:-zhihuiji}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-zhihuiji}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_INVITE_CODE: ${AUTH_INVITE_CODE:-021218}
      CORS_ORIGIN_PATTERS: ${CORS_ORIGIN_PATTERS:-http://154.217.241.207:*,https://154.217.241.207:*,http://124.222.153.108:*,https://124.222.153.108:*,http://localhost:*,http://127.0.0.1:*}
      AGENT_LLM_ENABLED: ${AGENT_LLM_ENABLED:-false}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-deepseek-v4-flash}
      AGENT_LLM_WIRE_API: ${AGENT_LLM_WIRE_API:-chat_completions}
      AGENT_LLM_REQUIRES_OPENAI_AUTH: ${AGENT_LLM_REQUIRES_OPENAI_AUTH:-true}
    ports:
      - "18080:18080"

volumes:
  postgres_data:
  redis_data:
