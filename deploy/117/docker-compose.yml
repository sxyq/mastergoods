services:
  postgres:
    image: m.daocloud.io/docker.io/library/postgres:15
    container_name: zhihuiji117-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhihuiji
      POSTGRES_USER: zhihuiji
      POSTGRES_PASSWORD: zhihuiji
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhihuiji -d zhihuiji"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: m.daocloud.io/docker.io/library/redis:7
    container_name: zhihuiji117-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: zhihuiji117-backend-local
    container_name: zhihuiji117-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 18080
      DB_URL: jdbc:postgresql://postgres:5432/zhihuiji
      DB_USER: zhihuiji
      DB_PASSWORD: zhihuiji
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_INVITE_CODE: "021218"
      AGENT_LLM_ENABLED: "false"
    ports:
      - "18080:18080"

volumes:
  postgres_data:
  redis_data:
