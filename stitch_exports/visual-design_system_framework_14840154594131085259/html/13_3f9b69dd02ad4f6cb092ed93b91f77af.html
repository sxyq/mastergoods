<style>
        body {
            background-color: theme('colors.background');
            background-image: linear-gradient(135deg, theme('colors.surface') 0%, theme('colors.surface-container-low') 100%);
            -webkit-tap-highlight-color: transparent;
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        
        .glass-card {

        }
        
        /* Aurora effect behind total amount */
        .aurora-bg {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 91, 191, 0.08) 0%, rgba(26, 115, 232, 0.05) 25%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .payment-radio:checked + div {
            border-color: theme('colors.primary');
            background-color: theme('colors.primary-fixed');
            color: theme('colors.on-primary-fixed');

<body class="text-on-background min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 pt-safe bg-surface/40 backdrop-blur-2xl border-b border-white/50">

<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center text-primary font-bold">
                        张
                    </div>
<div>

</div>
</div>
</div>
</section>

<input checked="" class="payment-radio sr-only" name="payment_method" type="radio" value="wechat">
<div class="glass-card rounded-lg p-3 flex flex-col items-center justify-center gap-2 border border-transparent transition-all h-24">

<script>
        // Simple micro-interaction for input format
        const amountInput = document.querySelector('input[type="number"]');
        const fullAmountBtn = document.querySelector('button.text-primary');
        
        fullAmountBtn.addEventListener('click', () => {
            amountInput.value = '12840.00';
            // Trigger a small pulse effect
            amountInput.classList.add('ring-2', 'ring-primary');
            setTimeout(() => amountInput.classList.remove('ring-2', 'ring-primary'), 200);
        });
