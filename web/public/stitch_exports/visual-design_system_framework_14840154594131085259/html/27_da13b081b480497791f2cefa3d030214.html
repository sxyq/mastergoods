<style>
        body {
            background-color: #f7f9fe;
            min-height: max(884px, 100dvh);
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Background Blobs */
        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: hsla(211, 100%, 85%, 0.8);
            top: -100px;
            left: -100px;
            animation: float-1 15s ease-in-out infinite alternate;
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: hsla(211, 100%, 90%, 0.7);
            bottom: 20%;
            right: -50px;
            animation: float-2 20s ease-in-out infinite alternate;
        }

        .blob-3 {
            width: 250px;
            height: 250px;
            background: hsla(211, 80%, 92%, 0.6);
            top: 40%;
            left: 20%;
            animation: float-3 18s ease-in-out infinite alternate;
        }

        @keyframes float-1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.1); }
        }

        @keyframes float-2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-40px, -60px) scale(1.15); }
        }

        @keyframes float-3 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, -40px) scale(1.05); }
        }

        /* Glass Card with Shimmer */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            z-index: 1;
            pointer-events: none;
            animation: shimmer 4s infinite;
        }

        /* Staggered Entrance Animations */
        .animate-slide-up {
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Item Removal Transition */
        .item-removing {
            animation: removeFadeRight 0.4s ease-out forwards;
        }

        @keyframes removeFadeRight {
            to {
                opacity: 0;
                transform: translateX(100%) scale(0.95);
                max-height: 0;
                padding: 0;
                margin: 0;
                border: none;
            }
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .glass-card::before,
            .blob-1, .blob-2, .blob-3,
            .animate-slide-up,
            .animate-pulse-soft {
                animation: none !important;
                transform: none !important;
                opacity: 1 !important;
            }
        }
    </style>
