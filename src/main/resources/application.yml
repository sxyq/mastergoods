server:
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: zhihuiji-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zhihuiji}
    username: ${DB_USER:zhihuiji}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: WARN

auth:
  invite-code: ${AUTH_INVITE_CODE:}

agent:
  llm:
    enabled: ${AGENT_LLM_ENABLED:false}
    base-url: ${AGENT_LLM_BASE_URL:https://token.sensenova.cn/v1/}
    api-key: ${AGENT_LLM_API_KEY:}
    model: ${AGENT_LLM_MODEL:deepseek-v4-flash}
    wire-api: ${AGENT_LLM_WIRE_API:chat_completions}
    requires-openai-auth: ${AGENT_LLM_REQUIRES_OPENAI_AUTH:true}
    anthropic-version: ${AGENT_LLM_ANTHROPIC_VERSION:2023-06-01}
    max-tokens: ${AGENT_LLM_MAX_TOKENS:4096}
    temperature: ${AGENT_LLM_TEMPERATURE:0.2}
    enable-thinking: ${AGENT_LLM_ENABLE_THINKING:true}
    thinking-budget: ${AGENT_LLM_THINKING_BUDGET:2048}
