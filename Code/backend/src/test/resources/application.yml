spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

agent:
  context:
    maximum-window: ${AGENT_CONTEXT_MAXIMUM_WINDOW:272000}
  llm:
    model: ${AGENT_LLM_MODEL:glm-5.3-flash}
    wire-api: ${AGENT_LLM_WIRE_API:chat_completions}
